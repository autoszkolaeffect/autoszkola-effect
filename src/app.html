<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Brygada 1918 is the display serif, Average Sans the body face. Average
		     Sans ships a single weight, so bold body text is synthesised - which is
		     exactly what the source design does. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Average+Sans&family=Brygada+1918:ital,wght@0,400..700;1,400..700&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
